[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crack-workflow-agent"
version = "0.1.0"
description = "Bounded workflow-rule hypothesis agent for the contained Crack lab"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../..", "../../scope-controller", "../router"]
