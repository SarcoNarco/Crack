[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crack-scope-controller"
version = "0.1.0"
description = "Fixed-scope capability gateway for the contained Crack lab"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]
